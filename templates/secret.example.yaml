# Template only — never commit a filled-in copy of this file.
#
# Kept outside k8s/ on purpose: Argo CD applies every manifest under k8s/,
# so a template there would overwrite the real secret with empty values.
#
# Copy to k8s/secret.yaml (gitignored), fill in real values, then:
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ngfwa-poc-secrets
  namespace: ngfwa-poc
stringData:
  KAFKA_BOOTSTRAP_SERVERS: "pkc-xxxxx.region.provider.confluent.cloud:9092"
  KAFKA_API_KEY: ""
  KAFKA_API_SECRET: ""
  SCHEMA_REGISTRY_URL: "https://psrc-xxxxx.region.provider.confluent.cloud"
  SCHEMA_REGISTRY_API_KEY: ""
  SCHEMA_REGISTRY_API_SECRET: ""
  DATABASE_URL: "postgresql://ngfwa:changeme@postgres:5432/ngfwa_poc"
