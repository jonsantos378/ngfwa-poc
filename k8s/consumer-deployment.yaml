apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngfwa-consumer
  namespace: ngfwa-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngfwa-consumer
  template:
    metadata:
      labels:
        app: ngfwa-consumer
    spec:
      containers:
        - name: consumer
          image: ghcr.io/jonsantos378/ngfwa-consumer:sha-cde92f4
          envFrom:
            - configMapRef:
                name: ngfwa-poc-config
            - secretRef:
                name: ngfwa-poc-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
