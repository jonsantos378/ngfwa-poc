apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngfwa-producer
  namespace: ngfwa-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngfwa-producer
  template:
    metadata:
      labels:
        app: ngfwa-producer
    spec:
      containers:
        - name: producer
          image: ghcr.io/jonsantos378/ngfwa-producer:sha-cde92f4
          envFrom:
            - configMapRef:
                name: ngfwa-poc-config
            - secretRef:
                name: ngfwa-poc-secrets
          # Pod-template override (wins over the ConfigMap), so changing it
          # by commit makes Argo CD roll out a new pod.
          env:
            - name: ANOMALY_RATE
              value: "0.10"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
