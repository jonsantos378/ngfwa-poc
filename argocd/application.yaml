apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ngfwa-poc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/jonsantos378/ngfwa-poc.git"
    targetRevision: main
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ngfwa-poc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
